<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06090e">
  <title>AL-SAT BOT PRO — Mobil</title>
  <style>
    html,body{margin:0;min-height:100%;background:#06090e;color:#f1f6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    #boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    #boot b{display:block;font-size:22px;margin-bottom:8px}#boot span{color:#8fa0b8;font-size:13px}
  </style>
</head>
<body>
  <div id="boot"><div><b>AL-SAT BOT PRO</b><span>Mobil sürüm açılıyor…</span></div></div>
  <script>
  (async()=>{
    const V='mobile-20260823-2';
    try{
      const r=await fetch('./index.html?'+V,{cache:'no-store'});
      if(!r.ok) throw new Error('index.html alınamadı ('+r.status+')');
      let html=await r.text();
      html=html
        .replace(/styles\.css\?v=[^"'<>\s]+/g,'styles.css?v='+V)
        .replace(/app\.js\?v=[^"'<>\s]+/g,'app.js?v='+V);
      const mobileCss=`<style id="mobile-safe-fix">
      @media(max-width:800px){
        html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important;-webkit-text-size-adjust:100%;touch-action:manipulation}
        body{padding-bottom:calc(78px + env(safe-area-inset-bottom))!important}
        .shell{display:block!important;width:100%!important;min-height:100dvh!important}
        .sidebar{position:fixed!important;left:0!important;right:0!important;bottom:0!important;top:auto!important;width:100%!important;height:auto!important;padding:6px 6px calc(6px + env(safe-area-inset-bottom))!important;border-right:0!important;border-bottom:0!important;border-top:1px solid #223044!important;z-index:99999!important;background:#070b11!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
        .logo,.sideFoot{display:none!important}
        .nav{display:flex!important;gap:4px!important;overflow-x:auto!important;overflow-y:hidden!important;white-space:nowrap!important;-webkit-overflow-scrolling:touch!important;scrollbar-width:none!important}
        .nav::-webkit-scrollbar{display:none!important}
        .nav a{flex:0 0 auto!important;min-width:76px!important;min-height:52px!important;padding:7px 8px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;font-size:10px!important;line-height:1.15!important}
        .main{display:block!important;width:100%!important;min-width:0!important;padding:12px 10px 18px!important}
        .topbar{display:block!important}.statusRow{justify-content:flex-start!important;margin-top:8px!important}
        .formGrid,.formGrid.twoCols,.two,.tvLayout{grid-template-columns:1fr!important}
        .cards,.three,.stats,.quickQuotes,.kpiGrid,.tvMiniGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
        input,select,button,.btn{min-height:44px!important;font-size:16px!important}
        .controls{display:flex!important;flex-wrap:wrap!important;gap:7px!important}
        .controls .btn{flex:1 1 140px!important}
        .tableWrap{width:100%!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch!important}
        .tableWrap table,table{min-width:680px!important}
        .canvasWrap{height:300px!important;min-height:260px!important}
        .tvChartBox{height:52vh!important;min-height:330px!important}
        canvas,img,svg,iframe{max-width:100%!important}
      }
      @media(max-width:520px){
        .main{padding:10px 8px 14px!important}
        .cards,.three,.quickQuotes,.kpiGrid{grid-template-columns:1fr!important}
        .stats,.tvMiniGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
        .nav a{min-width:72px!important;font-size:9px!important}
      }
      </style>`;
      html=html.replace('</head>',mobileCss+'</head>');
      document.open();document.write(html);document.close();
    }catch(e){
      document.getElementById('boot').innerHTML='<div><b>Mobil sürüm açılamadı</b><span>'+String(e.message||e)+'</span></div>';
    }
  })();
  </script>
</body>
</html>
