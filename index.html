<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AL-SAT BOT PRO</title><style>body{margin:0;background:#070b11;color:#eef4ff;font-family:system-ui}main{max-width:1200px;margin:auto;padding:20px}button,input{padding:12px;border-radius:10px;border:1px solid #29384c;background:#111a26;color:white;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap}.active{border-color:#36dda0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:15px}.s{padding:13px;background:#101721;border:1px solid #243044;border-radius:10px;cursor:pointer}.card{margin-top:16px;padding:18px;background:#0e151f;border:1px solid #243044;border-radius:14px}.green{color:#36dda0}.red{color:#ff6578}.muted{color:#91a0b5}input{width:min(500px,70%)}#price{font-size:32px;font-weight:900}</style></head><body><main><h1>AL-SAT BOT PRO</h1><p class="muted">Kripto • BIST 100 • ABD</p><div class="tabs"><button data-m="crypto" class="active">Kripto</button><button data-m="bist">BIST 100</button><button data-m="us">ABD</button></div><p><input id="q" placeholder="Sembol ara"></p><div id="count" class="muted"></div><div id="list" class="grid"></div><div id="detail" class="card" hidden><div id="source" class="muted"></div><h2 id="sym"></h2><div id="price">—</div><div id="change"></div><p id="stats" class="muted"></p></div></main><script>let market='crypto',items=[],ws;const $=x=>document.getElementById(x);async function load(){try{let r=await fetch('/api/symbols?market='+market),d=await r.json();items=d.items||[];render()}catch(e){$('count').textContent='Liste alınamadı: '+e.message}}function render(){let q=$('q').value.toUpperCase(),a=items.filter(x=>(x.symbol+' '+(x.name||'')).toUpperCase().includes(q));$('count').textContent=a.length+' sembol';$('list').innerHTML=a.slice(0,1000).map(x=>'<div class="s" data-s="'+x.symbol+'"><b>'+x.symbol+'</b><br><small class="muted">'+(x.name||'')+'</small></div>').join('');document.querySelectorAll('.s').forEach(x=>x.onclick=()=>detail(x.dataset.s))}async function detail(s){$('detail').hidden=false;$('sym').textContent=s;$('price').textContent='Yükleniyor...';if(ws)try{ws.close()}catch(e){}if(market==='crypto'){ $('source').textContent='Binance canlı WebSocket';ws=new WebSocket('wss://stream.binance.com:9443/ws/'+s.toLowerCase()+'@ticker');ws.onmessage=e=>{let d=JSON.parse(e.data),p=+d.P;$('price').textContent=Number(d.c).toLocaleString('tr-TR')+' USDT';$('change').textContent=(p>=0?'+':'')+p.toFixed(2)+'%';$('change').className=p>=0?'green':'red';$('stats').textContent='Yüksek '+d.h+' • Düşük '+d.l+' • Hacim '+d.q}}else{try{let r=await fetch('/api/market?kind='+market+'&symbol='+encodeURIComponent(s)),d=await r.json();if(!r.ok)throw Error(d.error||'Veri yok');$('source').textContent=d.source||'Market API';$('price').textContent=Number(d.price).toLocaleString('tr-TR')+(market==='bist'?' TRY':' USD');let p=+d.changePercent;$('change').textContent=(p>=0?'+':'')+p.toFixed(2)+'%';$('change').className=p>=0?'green':'red';$('stats').textContent='Açılış '+d.open+' • Yüksek '+d.high+' • Düşük '+d.low+' • Hacim '+d.volume}catch(e){$('price').textContent='—';$('change').textContent=e.message;$('change').className='red'}}}document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('active'));b.classList.add('active');market=b.dataset.m;$('detail').hidden=true;load()});$('q').oninput=render;load();</script></body></html>
