<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AL-SAT BOT PRO</title><style>html,body{margin:0;background:#06090e;color:#fff;font-family:system-ui}body{display:grid;place-items:center;min-height:100vh}.loading{opacity:.8}</style></head><body><div class="loading">Eski AL-SAT BOT PRO yükleniyor...</div><script>(async()=>{try{const base='https://raw.githubusercontent.com/etemyiyor/al-sat-bot-pro/main/legacy/';let b='';for(let i=0;i<5;i++){const r=await fetch(base+'part-'+String(i).padStart(2,'0')+'.txt?v=old',{cache:'no-store'});if(!r.ok)throw Error('Dosya parçası alınamadı: '+r.status);b+=await r.text()}const u=Uint8Array.from(atob(b.trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="white-space:pre-wrap;padding:20px">Eski sürüm yüklenemedi: '+e.message+'</pre>'}})();</script></body></html>
