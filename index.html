<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AL-SAT BOT PRO</title><style>body{margin:0;background:#070b11;color:#eef4ff;font-family:system-ui}main{max-width:1200px;margin:auto;padding:20px}button,input,select{padding:12px;border-radius:10px;border:1px solid #29384c;background:#111a26;color:white}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.s,.btn{cursor:pointer}.active{border-color:#36dda0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:15px}.s{padding:13px;background:#101721;border:1px solid #243044;border-radius:10px}.card{margin-top:16px;padding:18px;background:#0e151f;border:1px solid #243044;border-radius:14px}.green{color:#36dda0}.red{color:#ff6578}.yellow{color:#e8c66e}.muted{color:#91a0b5}input{width:min(500px,70%)}#price{font-size:32px;font-weight:900}.tradegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.tradegrid input,.tradegrid select{width:100%}.preview{margin-top:12px;padding:12px;background:#0a111a;border:1px solid #243044;border-radius:10px}.btn{margin-top:10px}.btn.primary{border-color:#36dda0;background:#123026}.btn:disabled{opacity:.45;cursor:not-allowed}@media(max-width:700px){.tradegrid{grid-template-columns:1fr}}</style></head><body><main><h1>AL-SAT BOT PRO</h1><p class="muted">Kripto • BIST 100 • ABD • Binance Testnet</p><div class="tabs"><button data-m="crypto" class="active">Kripto</button><button data-m="bist">BIST 100</button><button data-m="us">ABD</button></div><p><input id="q" placeholder="Sembol ara"></p><div id="count" class="muted"></div><div id="list" class="grid"></div><div id="detail" class="card" hidden><div id="source" class="muted"></div><h2 id="sym"></h2><div id="price">—</div><div id="change"></div><p id="stats" class="muted"></p><div id="tradePanel" hidden><hr style="border-color:#243044"><h3>Testnet Emir Paneli</h3><div class="tradegrid"><select id="side"><option value="BUY">AL</option><option value="SELL">SAT</option></select><input id="qty" type="number" step="0.000001" min="0" placeholder="Miktar"><input id="accountSize" type="number" min="1" value="10000" placeholder="Hesap büyüklüğü"><input id="sl" type="number" min="0.1" step="0.1" value="2" placeholder="Stop-loss %"><input id="tp" type="number" min="0.1" step="0.1" value="4" placeholder="Take-profit %"><input id="risk" type="number" min="0.1" step="0.1" value="1" placeholder="Maks risk %"></div><button class="btn" id="previewBtn">Emri Önizle</button><div id="preview" class="preview muted">Önce emri önizle.</div><button class="btn primary" id="sendTestnet" disabled>Testnet'e Gönder</button><div id="orderMsg" class="muted"></div></div></div></main><script>let market='crypto',items=[],ws,currentSymbol='',currentPrice=0,lastPreview=null;const $=x=>document.getElementById(x);async function load(){try{let r=await fetch('/api/symbols?market='+market),d=await r.json();items=d.items||[];render()}catch(e){$('count').textContent='Liste alınamadı: '+e.message}}function render(){let q=$('q').value.toUpperCase(),a=items.filter(x=>(x.symbol+' '+(x.name||'')).toUpperCase().includes(q));$('count').textContent=a.length+' sembol';$('list').innerHTML=a.slice(0,1000).map(x=>'<div class="s" data-s="'+x.symbol+'"><b>'+x.symbol+'</b><br><small class="muted">'+(x.name||'')+'</small></div>').join('');document.querySelectorAll('.s').forEach(x=>x.onclick=()=>detail(x.dataset.s))}async function detail(s){currentSymbol=s;currentPrice=0;lastPreview=null;$('sendTestnet').disabled=true;$('preview').textContent='Önce emri önizle.';$('detail').hidden=false;$('sym').textContent=s;$('price').textContent='Yükleniyor...';$('tradePanel').hidden=market!=='crypto';if(ws)try{ws.close()}catch(e){}if(market==='crypto'){$('source').textContent='Binance canlı WebSocket';ws=new WebSocket('wss://stream.binance.com:9443/ws/'+s.toLowerCase()+'@ticker');ws.onmessage=e=>{let d=JSON.parse(e.data),p=+d.P;currentPrice=Number(d.c);$('price').textContent=currentPrice.toLocaleString('tr-TR')+' USDT';$('change').textContent=(p>=0?'+':'')+p.toFixed(2)+'%';$('change').className=p>=0?'green':'red';$('stats').textContent='Yüksek '+d.h+' • Düşük '+d.l+' • Hacim '+d.q}}else{try{let r=await fetch('/api/market?kind='+market+'&symbol='+encodeURIComponent(s)),d=await r.json();if(!r.ok)throw Error(d.error||'Veri yok');$('source').textContent=d.source||'Market API';currentPrice=Number(d.price);$('price').textContent=currentPrice.toLocaleString('tr-TR')+(market==='bist'?' TRY':' USD');let p=+d.changePercent;$('change').textContent=(p>=0?'+':'')+p.toFixed(2)+'%';$('change').className=p>=0?'green':'red';$('stats').textContent='Açılış '+d.open+' • Yüksek '+d.high+' • Düşük '+d.low+' • Hacim '+d.volume}catch(e){$('price').textContent='—';$('change').textContent=e.message;$('change').className='red'}}}document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('active'));b.classList.add('active');market=b.dataset.m;$('detail').hidden=true;load()});$('q').oninput=render;$('previewBtn').onclick=async()=>{try{if(!currentPrice)throw Error('Fiyat henüz gelmedi');let body={symbol:currentSymbol,side:$('side').value,quantity:Number($('qty').value),price:currentPrice,stopLossPct:Number($('sl').value),takeProfitPct:Number($('tp').value),maxRiskPct:Number($('risk').value),accountSize:Number($('accountSize').value)};let r=await fetch('/api/order-preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Önizleme başarısız');lastPreview=d;let pass=d.riskCheck==='PASS';$('preview').innerHTML='Nominal: <b>'+d.notional.toFixed(2)+'</b> USDT<br>Stop: <b>'+d.stopPrice.toFixed(6)+'</b><br>Take Profit: <b>'+d.takePrice.toFixed(6)+'</b><br>Tahmini Risk: <b>'+d.estimatedRisk.toFixed(2)+'</b> / İzin Verilen: <b>'+d.maxAllowedRisk.toFixed(2)+'</b><br>Risk: <b class="'+(pass?'green':'red')+'">'+d.riskCheck+'</b>';$('sendTestnet').disabled=!pass}catch(e){lastPreview=null;$('sendTestnet').disabled=true;$('preview').textContent=e.message}};$('sendTestnet').onclick=async()=>{try{if(!lastPreview||lastPreview.riskCheck!=='PASS')throw Error('Risk kontrolü geçmedi');$('orderMsg').textContent='Testnet emri gönderiliyor...';let r=await fetch('/api/testnet-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:currentSymbol,side:$('side').value,quantity:Number($('qty').value)})}),d=await r.json();if(!r.ok)throw Error(d.error||'Testnet emri başarısız');$('orderMsg').textContent='Testnet emri başarılı. Order ID: '+(d.order?.orderId??'—');$('orderMsg').className='green'}catch(e){$('orderMsg').textContent=e.message;$('orderMsg').className='red'}};load();</script></body></html>
