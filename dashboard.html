<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Testnet Dashboard</title><style>body{background:#070b11;color:#eef4ff;font-family:system-ui;margin:0}main{max-width:1100px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{background:#0e151f;border:1px solid #243044;border-radius:14px;padding:16px;margin-bottom:12px}.muted{color:#91a0b5}.green{color:#36dda0}.red{color:#ff6578}input,button,select{background:#111a26;color:#fff;border:1px solid #29384c;border-radius:9px;padding:10px}canvas{width:100%;height:220px;background:#091019;border-radius:10px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #243044}</style></head><body><main><h1>Testnet Portföy & Analiz</h1><p><a href="./" style="color:#36dda0">← Piyasa ekranı</a></p><div class="cards"><div class="card"><b>Testnet Hesabı</b><div id="account" class="muted">Yükleniyor...</div></div><div class="card"><b>Teknik Sinyal</b><p><input id="symbol" value="BTCUSDT"><select id="interval"><option>15m</option><option selected>1h</option><option>4h</option><option>1d</option></select><button id="analyze">Analiz</button></p><div id="signal" class="muted">—</div></div></div><div class="card"><h3>Fiyat Grafiği</h3><canvas id="chart" width="1000" height="220"></canvas></div><div class="card"><h3>Testnet Varlıkları</h3><table><thead><tr><th>Varlık</th><th>Serbest</th><th>Kilitli</th><th>Toplam</th></tr></thead><tbody id="balances"></tbody></table></div><div class="card"><h3>İşlem Geçmişi</h3><p class="muted">Bu panel, bu tarayıcıdan gönderilen testnet emirlerini yerel olarak gösterir.</p><table><thead><tr><th>Zaman</th><th>Sembol</th><th>Yön</th><th>Miktar</th><th>Order ID</th></tr></thead><tbody id="history"></tbody></table></div><script>const $=x=>document.getElementById(x);async function account(){try{let r=await fetch('/api/testnet-account'),d=await r.json();if(!r.ok)throw Error(d.error);$('account').innerHTML='Mod: <b>'+d.mode+'</b><br>İşlem: '+(d.canTrade?'Açık':'Kapalı');$('balances').innerHTML=d.balances.map(x=>'<tr><td>'+x.asset+'</td><td>'+x.free+'</td><td>'+x.locked+'</td><td>'+(x.free+x.locked)+'</td></tr>').join('')}catch(e){$('account').textContent=e.message}}function draw(series){let c=$('chart'),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);if(!series.length)return;let v=series.map(a=>a.close),mn=Math.min(...v),mx=Math.max(...v),pad=20;x.beginPath();series.forEach((a,i)=>{let px=pad+i*(w-2*pad)/(series.length-1),py=h-pad-(a.close-mn)/(mx-mn||1)*(h-2*pad);i?x.lineTo(px,py):x.moveTo(px,py)});x.strokeStyle='#36dda0';x.lineWidth=2;x.stroke()}async function analyze(){try{let s=$('symbol').value.toUpperCase(),i=$('interval').value,r=await fetch('/api/indicators?symbol='+encodeURIComponent(s)+'&interval='+i),d=await r.json();if(!r.ok)throw Error(d.error);let cls=d.signal.includes('AL')?'green':d.signal.includes('SAT')?'red':'';$('signal').innerHTML='RSI: <b>'+d.rsi.toFixed(2)+'</b><br>MACD: <b>'+d.macd.toFixed(6)+'</b><br>Signal: <b>'+d.macdSignal.toFixed(6)+'</b><br>Karar: <b class="'+cls+'">'+d.signal+'</b>';draw(d.series)}catch(e){$('signal').textContent=e.message}}function history(){let h=JSON.parse(localStorage.getItem('testnetHistory')||'[]');$('history').innerHTML=h.map(x=>'<tr><td>'+new Date(x.time).toLocaleString('tr-TR')+'</td><td>'+x.symbol+'</td><td>'+x.side+'</td><td>'+x.quantity+'</td><td>'+x.orderId+'</td></tr>').join('')}$('analyze').onclick=analyze;account();analyze();history();</script></main></body></html>
