<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06090e"><title>AL-SAT BOT PRO v15</title><style>html,body{margin:0;background:#06090e;color:#fff;font-family:system-ui}body{min-height:100vh;display:grid;place-items:center}.box{max-width:560px;padding:28px;text-align:center}.bar{height:5px;background:#172332;border-radius:99px;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:25%;background:#35d49a;animation:m 1s infinite alternate}@keyframes m{to{width:100%}}</style></head><body><div class="box"><h2>AL-SAT BOT PRO v15</h2><div>Premium arayüz + BIST100 + AI PRO yükleniyor…</div><div class="bar"><i></i></div></div><script>(async()=>{try{const raw='https://raw.githubusercontent.com/etemyiyor/al-sat-bot-pro/main/';const names=['index.html','styles.css','premium.css','app-0.js','app-1.js','app-2.js','app-3.js','app-4.js','app-5.js'];const res=await Promise.all(names.map(n=>fetch(raw+n+'?v=15-'+Date.now(),{cache:'no-store'})));if(res.some(r=>!r.ok))throw Error('Güncel dosyalardan biri alınamadı');const txt=await Promise.all(res.map(r=>r.text()));let h=txt[0];h=h.replace(/<link[^>]*styles\.css[^>]*>/i,'<style>'+txt[1]+'</style><style>'+txt[2]+'</style>');h=h.replace(/<script[^>]*app\.js[^>]*><\/script>/i,txt.slice(3).map(x=>'<script>'+x.replace(/<\/script>/gi,'<\\/script>')+'<\/script>').join(''));document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="box"><h2>Yükleme hatası</h2><p>'+e.message+'</p><p>Sayfayı yenileyin.</p></div>'}})();</script></body></html>
