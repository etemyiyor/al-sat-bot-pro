name: Deploy Telegram Trading Bot

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "telegram-worker/**"
      - ".github/workflows/telegram-bot.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_ALLOWED: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          TG_WEBHOOK: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          for n in CF_TOKEN CF_ACCOUNT TG_TOKEN TG_ALLOWED TG_WEBHOOK; do
            if [ -z "${!n:-}" ]; then echo "Eksik GitHub secret: $n"; exit 1; fi
          done
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Set Worker secrets
        working-directory: telegram-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$TELEGRAM_BOT_TOKEN" | wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.jsonc
          printf '%s' "$TELEGRAM_ALLOWED_USER_IDS" | wrangler secret put TELEGRAM_ALLOWED_USER_IDS --config wrangler.jsonc
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | wrangler secret put TELEGRAM_WEBHOOK_SECRET --config wrangler.jsonc
      - name: Deploy Worker and capture URL
        id: deploy
        working-directory: telegram-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler deploy --config wrangler.jsonc 2>&1 | tee /tmp/wrangler-deploy.log
          URL=$(grep -Eo 'https://al-sat-telegram-bot\.[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 || true)
          if [ -z "$URL" ]; then
            echo "Worker URL output could not be detected. Open Cloudflare dashboard > Workers & Pages and copy the deployed workers.dev URL."
            exit 1
          fi
          echo "worker_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Worker URL: $URL"
      - name: Configure Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook"             -H "Content-Type: application/json"             -d "$(jq -n --arg url "${WORKER_URL}/telegram" --arg secret "${TELEGRAM_WEBHOOK_SECRET}" '{url:$url,secret_token:$secret,allowed_updates:["message"],drop_pending_updates:true}')"
          echo
          curl --fail --silent --show-error "${WORKER_URL}/health"
          echo
