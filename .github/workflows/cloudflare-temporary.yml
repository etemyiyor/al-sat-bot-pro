name: Temporary Cloudflare Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-temporary.yml"
      - "cloudflare-worker/**"
      - "CF_TEMP_TRIGGER.txt"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-temporary.yml"
      - "cloudflare-worker/**"
      - "CF_TEMP_TRIGGER.txt"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to temporary Cloudflare account
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cloudflare-temporary.out"
          set +e
          npx --yes wrangler@4 deploy --temporary > "$OUT" 2>&1
          CODE=$?
          set -e

          LIVE_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$OUT" | tail -n1 || true)"
          CLAIM_URL="$(grep -Eo 'https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+' "$OUT" | tail -n1 | sed 's/[),]$//' || true)"

          if [ "$CODE" -ne 0 ] || [ -z "$LIVE_URL" ] || [ -z "$CLAIM_URL" ]; then
            {
              echo "status=failure"
              echo "exit_code=$CODE"
              echo "live_url=${LIVE_URL:-not_found}"
            } > ../cloudflare-temporary-status.txt
            sed -E 's#https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+#CLAIM_URL_REDACTED#g' "$OUT" | tail -n 80 > ../cloudflare-temporary-error.txt
            exit 1
          fi

          cat > "$RUNNER_TEMP/claim-public.pem" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA8nSzhMrsqRNFEogIOZ//
          ETibsmTtu+f+udpY+ewjhL6vl+dw8GRx4ld2tnGQuKg81x9Nufp1lyXRiGuLp1bP
          kHSSkyql7SSyqSv9Peyri/e61kFsuJQbLBrYXULkx1kuMFEEU6g8dHyrQ+QZXC2K
          Pm7nhJ+95E0yxHkcisKMP36dEsZIsdr3GOGiuMaZ9kslp77r7rPHJPW2qGllQd5i
          Vt8r7XeQDg+hNAWaR3sQP9UGQShJPHRarvpB1xDTxFtY5c5SIwctc20dHcpLmwBe
          a+02kGDdspBRCnoTh657Q1SIJP1TiwVhOWqIu/CQ7igpUw/ExhdnZu5GtSVP7hQN
          twIDAQAB
          -----END PUBLIC KEY-----
          PEM

          printf '%s' "$CLAIM_URL" | openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/claim-public.pem" -pkeyopt rsa_padding_mode:oaep -out "$RUNNER_TEMP/claim.bin"
          CLAIM_B64="$(base64 -w0 "$RUNNER_TEMP/claim.bin")"

          {
            echo "status=success"
            echo "live_url=$LIVE_URL"
            echo "claim_encrypted_b64=$CLAIM_B64"
            echo "claim_window_minutes=60"
          } > ../cloudflare-temporary-result.txt

      - name: Save deployment result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f cloudflare-temporary-result.txt ] && git add cloudflare-temporary-result.txt
          [ -f cloudflare-temporary-status.txt ] && git add cloudflare-temporary-status.txt
          [ -f cloudflare-temporary-error.txt ] && git add cloudflare-temporary-error.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record temporary Cloudflare deployment"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
