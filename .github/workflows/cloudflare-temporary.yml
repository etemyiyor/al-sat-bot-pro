name: Temporary Cloudflare Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-temporary.yml"
      - "cloudflare-worker/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-temporary.yml"
      - "cloudflare-worker/**"
      - "CF_TEMP_TRIGGER.txt"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to temporary Cloudflare account
        id: deploy
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cloudflare-temporary.out"
          set +e
          npx --yes wrangler@4 deploy --temporary > "$OUT" 2>&1
          CODE=$?
          set -e

          LIVE_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$OUT" | tail -n1 || true)"
          CLAIM_URL="$(grep -Eo 'https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+' "$OUT" | tail -n1 | sed 's/[),]$//' || true)"

          if [ "$CODE" -ne 0 ] || [ -z "$LIVE_URL" ] || [ -z "$CLAIM_URL" ]; then
            echo "TEMP_DEPLOY_STATUS=failure"
            echo "TEMP_DEPLOY_EXIT_CODE=$CODE"
            echo "TEMP_LIVE_URL=${LIVE_URL:-not_found}"
            sed -E 's#https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+#CLAIM_URL_REDACTED#g' "$OUT" | tail -n 60
            exit 1
          fi

          cat > "$RUNNER_TEMP/claim-public.pem" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAkP487LoizB/RYuoaIPbm
          Sjq/XFqnLH1TEKZPr4filKVVOcqAFD5pAtqE24/0sK3gLLPaQmumswF7oj9EkZyV
          fxcyuxEGfDA4+hl/0leTH76trgdbsxErSWq5F+iLunZ68kWDw+wX9OeyoGf6wuQ9
          xYCSOIkO7TUr4w05MnRK9J12IAByyNsxWZeQVPrw50tyt1pJx/GQHhP4Tcd5mAxn
          brv1/AsydUPuJPMeVcwco5YGXfSYjH2GT2kKyPk1FsqbB3Aqjokg2NWOh7zY4ojh
          Ea9G3ccudVkV0yMZfN5yMkMwxlrjLkuGf0yxUWO9SUEj42m9iETDL6/DfWFBk0CZ
          8QIDAQAB
          -----END PUBLIC KEY-----
          PEM

          printf '%s' "$CLAIM_URL" | openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/claim-public.pem" -pkeyopt rsa_padding_mode:oaep -out "$RUNNER_TEMP/claim.bin"
          CLAIM_B64="$(base64 -w0 "$RUNNER_TEMP/claim.bin")"

          echo "TEMP_DEPLOY_STATUS=success"
          echo "TEMP_LIVE_URL=$LIVE_URL"
          echo "TEMP_CLAIM_ENCRYPTED_B64=$CLAIM_B64"
