name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/cloudflare-worker.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/cloudflare-worker.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Cloudflare credentials
        env:
          CF_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN_VAR: ${{ vars.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CF_TOKEN="${CF_TOKEN_SECRET:-${CF_TOKEN_VAR:-}}"
          CF_ACCOUNT="${CF_ACCOUNT_SECRET:-${CF_ACCOUNT_VAR:-}}"
          test -n "$CF_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing in GitHub Secrets/Variables" && exit 1)
          test -n "$CF_ACCOUNT" || (echo "CLOUDFLARE_ACCOUNT_ID is missing in GitHub Secrets/Variables" && exit 1)
          echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$CF_ACCOUNT" >> "$GITHUB_ENV"
          echo "Cloudflare credentials are configured"

      - name: Provision D1 auth database
        id: d1
        working-directory: cloudflare-worker
        env:
          DB_NAME: tradex-ai-auth
        run: |
          set -euo pipefail
          npm exec --yes wrangler@latest -- d1 list --json > /tmp/d1.json
          DB_ID=$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));const d=a.find(x=>x.name===process.env.DB_NAME);if(d)process.stdout.write(d.uuid||d.id||'')")
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database $DB_NAME"
            npm exec --yes wrangler@latest -- d1 create "$DB_NAME"
            npm exec --yes wrangler@latest -- d1 list --json > /tmp/d1.json
            DB_ID=$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));const d=a.find(x=>x.name===process.env.DB_NAME);if(!d)process.exit(2);process.stdout.write(d.uuid||d.id||'')")
          fi
          echo "Using D1 database: $DB_NAME ($DB_ID)"
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
          DB_ID="$DB_ID" node <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.d1_databases=[{binding:'DB',database_name:process.env.DB_NAME,database_id:process.env.DB_ID,migrations_dir:'migrations'}];
          fs.writeFileSync('wrangler.deploy.jsonc',JSON.stringify(cfg,null,2));
          NODE
          npm exec --yes wrangler@latest -- d1 execute "$DB_NAME" --remote --file=migrations/0001_auth.sql --yes

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy --config wrangler.deploy.jsonc

      - name: Verify deployed health
        id: health
        if: success()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          URL="${DEPLOYMENT_URL%/}/health"
          echo "Checking $URL"
          BODY=$(curl -fsS "$URL")
          echo "$BODY"
          node -e "const d=JSON.parse(process.argv[1]); if(!d.ok || !d.authDatabaseConfigured) process.exit(2)" "$BODY"
          echo "health_ok=true" >> "$GITHUB_OUTPUT"

      - name: Save permanent deployment result
        if: always() && github.event_name != 'pull_request'
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DB_ID: ${{ steps.d1.outputs.db_id }}
          HEALTH_OK: ${{ steps.health.outputs.health_ok }}
        run: |
          set -euo pipefail
          {
            echo "status=$JOB_STATUS"
            echo "live_url=${DEPLOYMENT_URL:-not_available}"
            echo "d1_database=tradex-ai-auth"
            echo "d1_database_id=${DB_ID:-not_available}"
            echo "health_ok=${HEALTH_OK:-false}"
          } > cloudflare-permanent-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-permanent-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record permanent Cloudflare deployment"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
