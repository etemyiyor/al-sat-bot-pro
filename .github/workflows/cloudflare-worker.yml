name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/cloudflare-worker.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/cloudflare-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CF_TOKEN:-}" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "${CF_ACCOUNT:-}" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)
          echo "Cloudflare secrets are configured"

      - name: Provision D1 auth database
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_NAME: al-sat-bot-pro-auth
        run: |
          set -euo pipefail
          npm exec --yes wrangler@latest -- d1 list --json > /tmp/d1.json
          DB_ID=$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));const d=a.find(x=>x.name===process.env.DB_NAME);if(d)process.stdout.write(d.uuid||d.id||'')")
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database $DB_NAME"
            npm exec --yes wrangler@latest -- d1 create "$DB_NAME"
            npm exec --yes wrangler@latest -- d1 list --json > /tmp/d1.json
            DB_ID=$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));const d=a.find(x=>x.name===process.env.DB_NAME);if(!d)process.exit(2);process.stdout.write(d.uuid||d.id||'')")
          fi
          echo "Using D1 database: $DB_NAME ($DB_ID)"
          DB_ID="$DB_ID" node <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.d1_databases=[{binding:'DB',database_name:process.env.DB_NAME,database_id:process.env.DB_ID,migrations_dir:'migrations'}];
          fs.writeFileSync('wrangler.deploy.jsonc',JSON.stringify(cfg,null,2));
          NODE
          npm exec --yes wrangler@latest -- d1 execute "$DB_NAME" --remote --file=migrations/0001_auth.sql --yes

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy --config wrangler.deploy.jsonc

      - name: Print deployment URL
        if: success()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "deployment_url=${DEPLOYMENT_URL}"
