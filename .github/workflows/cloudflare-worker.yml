name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/cloudflare-worker.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy

      - name: Enable workers.dev and save live URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          SCRIPT_NAME="al-sat-bot-pro-bloomberg"

          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"enabled":true,"previews_enabled":true}' \
            > /tmp/worker-subdomain.json

          python - <<'PY'
          import json
          d=json.load(open('/tmp/worker-subdomain.json'))
          if not d.get('success'):
              raise SystemExit('workers.dev etkinleştirilemedi: '+json.dumps(d.get('errors', []), ensure_ascii=False))
          PY

          curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            > /tmp/account-subdomain.json

          python - <<'PY' > cloudflare-deploy-url.txt
          import json
          d=json.load(open('/tmp/account-subdomain.json'))
          if not d.get('success') or not d.get('result',{}).get('subdomain'):
              raise SystemExit('Cloudflare hesap alt alanı alınamadı: '+json.dumps(d.get('errors', []), ensure_ascii=False))
          sub=d['result']['subdomain']
          print(f'https://al-sat-bot-pro-bloomberg.{sub}.workers.dev')
          PY

          echo "Cloudflare canlı adresi: $(cat cloudflare-deploy-url.txt)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-deploy-url.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Cloudflare live URL"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
