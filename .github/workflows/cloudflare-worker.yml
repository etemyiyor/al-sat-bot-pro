name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/cloudflare-worker.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy

      - name: Save live deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          COMMAND_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          set -euo pipefail

          url="${DEPLOYMENT_URL:-}"
          if [ -z "$url" ]; then
            url="$(printf '%s\n' "$COMMAND_OUTPUT" | grep -Eo 'https?://[^[:space:]]+' | tail -n1 || true)"
          fi

          url="$(printf '%s' "$url" | sed 's/ .*//' | sed 's/[),]$//')"
          if [ -n "$url" ] && [[ "$url" != http://* ]] && [[ "$url" != https://* ]]; then
            url="https://$url"
          fi

          if [ -z "$url" ]; then
            echo "Cloudflare deploy URL alınamadı. Wrangler çıktısı:"
            printf '%s\n' "$COMMAND_OUTPUT"
            exit 1
          fi

          printf '%s\n' "$url" > cloudflare-deploy-url.txt
          echo "Cloudflare canlı adresi: $url"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-deploy-url.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Cloudflare live URL"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
