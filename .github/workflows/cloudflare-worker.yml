name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/cloudflare-worker.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/cloudflare-worker.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Cloudflare credentials
        env:
          CF_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN_VAR: ${{ vars.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CF_TOKEN="${CF_TOKEN_SECRET:-${CF_TOKEN_VAR:-}}"
          CF_ACCOUNT="${CF_ACCOUNT_SECRET:-${CF_ACCOUNT_VAR:-}}"
          if [ -z "$CF_TOKEN" ]; then
            echo "credentials" > /tmp/cf_stage
            echo "CLOUDFLARE_API_TOKEN is missing" > /tmp/cf_error
            exit 1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "credentials" > /tmp/cf_stage
            echo "CLOUDFLARE_ACCOUNT_ID is missing" > /tmp/cf_error
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$CF_ACCOUNT" >> "$GITHUB_ENV"
          echo "credentials_ok" > /tmp/cf_stage
          echo "none" > /tmp/cf_error

      - name: Provision D1 auth database
        id: d1
        working-directory: cloudflare-worker
        env:
          DB_NAME: tradex-ai-auth
        run: |
          set -euo pipefail
          echo "d1_list" > /tmp/cf_stage
          npm exec --yes wrangler@latest -- d1 list --json > /tmp/d1.json 2> /tmp/d1.err || {
            tail -n 40 /tmp/d1.err > /tmp/cf_error
            exit 1
          }
          DB_ID=$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));const d=a.find(x=>x.name===process.env.DB_NAME);if(d)process.stdout.write(d.uuid||d.id||'')")
          if [ -z "$DB_ID" ]; then
            echo "d1_create" > /tmp/cf_stage
            npm exec --yes wrangler@latest -- d1 create "$DB_NAME" > /tmp/d1-create.out 2> /tmp/d1-create.err || {
              cat /tmp/d1-create.err /tmp/d1-create.out | tail -n 40 > /tmp/cf_error
              exit 1
            }
            npm exec --yes wrangler@latest -- d1 list --json > /tmp/d1.json 2> /tmp/d1.err
            DB_ID=$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));const d=a.find(x=>x.name===process.env.DB_NAME);if(!d)process.exit(2);process.stdout.write(d.uuid||d.id||'')")
          fi
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "d1_config" > /tmp/cf_stage
          DB_ID="$DB_ID" node <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.d1_databases=[{binding:'DB',database_name:process.env.DB_NAME,database_id:process.env.DB_ID,migrations_dir:'migrations'}];
          fs.writeFileSync('wrangler.deploy.jsonc',JSON.stringify(cfg,null,2));
          NODE
          echo "d1_migrate" > /tmp/cf_stage
          npm exec --yes wrangler@latest -- d1 migrations apply "$DB_NAME" --remote --config wrangler.deploy.jsonc > /tmp/d1-migrate.out 2> /tmp/d1-migrate.err || {
            cat /tmp/d1-migrate.err /tmp/d1-migrate.out | tail -n 60 > /tmp/cf_error
            exit 1
          }
          echo "d1_ok" > /tmp/cf_stage
          echo "none" > /tmp/cf_error

      - name: Sync optional admin access secret
        if: success() && github.event_name != 'pull_request'
        working-directory: cloudflare-worker
        env:
          ADMIN_ACCESS_CODE: ${{ secrets.ADMIN_ACCESS_CODE }}
        run: |
          set -euo pipefail
          if [ -n "${ADMIN_ACCESS_CODE:-}" ]; then
            printf '%s' "$ADMIN_ACCESS_CODE" | npm exec --yes wrangler@latest -- secret put ADMIN_ACCESS_CODE --config wrangler.deploy.jsonc >/tmp/admin-secret.out 2>/tmp/admin-secret.err
          fi
          echo "admin_secret_optional" > /tmp/cf_stage
          echo "none" > /tmp/cf_error

      - name: Deploy Worker
        id: deploy
        if: success()
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy --config wrangler.deploy.jsonc

      - name: Verify deployed health
        id: health
        if: success()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          echo "health" > /tmp/cf_stage
          URL="${DEPLOYMENT_URL%/}/health"
          BODY=$(curl -fsS "$URL")
          node -e "const d=JSON.parse(process.argv[1]); if(!d.ok || !d.authDatabaseConfigured) process.exit(2)" "$BODY"
          echo "health_ok=true" >> "$GITHUB_OUTPUT"
          echo "health_ok" > /tmp/cf_stage
          echo "none" > /tmp/cf_error

      - name: Save permanent deployment result
        if: always() && github.event_name != 'pull_request'
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DB_ID: ${{ steps.d1.outputs.db_id }}
          HEALTH_OK: ${{ steps.health.outputs.health_ok }}
        run: |
          set -euo pipefail
          STAGE=$(cat /tmp/cf_stage 2>/dev/null || echo unknown)
          ERROR=$(cat /tmp/cf_error 2>/dev/null || echo unavailable)
          {
            echo "status=$JOB_STATUS"
            echo "live_url=${DEPLOYMENT_URL:-not_available}"
            echo "d1_database=tradex-ai-auth"
            echo "d1_database_id=${DB_ID:-not_available}"
            echo "health_ok=${HEALTH_OK:-false}"
            echo "failure_stage=$STAGE"
            echo "error_begin"
            printf '%s\n' "$ERROR"
            echo "error_end"
          } > cloudflare-permanent-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-permanent-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record permanent Cloudflare deployment diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
